# ============================================================
# MySQL via Laragon
#
# 1. Abra o Laragon → Iniciar Tudo (MySQL na porta 3306)
# 2. No HeidiSQL (sessão Laragon.MySQL) execute:
#      CREATE DATABASE jobportal;
# 3. Se a senha do root for diferente, altere abaixo.
# ============================================================
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=root
quarkus.datasource.password=
quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/jobportal?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# Cria/atualiza tabelas a partir das @Entity
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

quarkus.http.port=8080
quarkus.qute.strict-rendering=false
