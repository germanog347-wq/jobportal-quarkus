<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Entrar — Portal de Vagas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include navbar.html /}
<main class="container">
    <div class="auth-wrap">
        <div class="card">
            <h1>Entrar</h1>
            <p class="subtitle">Use seu e-mail e senha para acessar a conta.</p>
            {#if erro}<div class="alert alert-erro">{erro}</div>{/if}
            {#if msg}<div class="alert alert-msg">{msg}</div>{/if}
            <form method="post" action="/auth/login">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" value="{email ?: ''}" required autocomplete="email" placeholder="seu@email.com">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required autocomplete="current-password" placeholder="••••••••">
                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Entrar</button>
                    <a href="/usuario/cadastro" class="btn btn-outline">Criar conta</a>
                </div>
            </form>
        </div>
    </div>
</main>
{#include footer.html /}
<script src="/js/app.js"></script>
</body>
</html>
