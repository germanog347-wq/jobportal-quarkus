<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin — Vagas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include fragments/nav.html}{/include}
<div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.75rem;margin-bottom:1rem">
        <h1 class="page-title" style="margin:0">Admin — Vagas</h1>
        <a class="btn btn-primary" href="/admin/vagas/nova">+ Nova vaga</a>
    </div>
    {#if msg}<div class="alert alert-msg">{msg}</div>{/if}
    {#if erro}<div class="alert alert-erro">{erro}</div>{/if}
    <table>
        <thead><tr><th>Título</th><th>Empresa</th><th>Ativa</th><th>Ações</th></tr></thead>
        <tbody>
        {#for v in vagas}
            <tr>
                <td>{v.titulo}</td>
                <td>{v.empresa}</td>
                <td>{#if v.ativa}<span class="badge">Sim</span>{#else}Não{/if}</td>
                <td>
                    <a class="btn btn-sm btn-outline" href="/admin/vagas/editar/{v.id}">Editar</a>
                    <form method="post" action="/admin/vagas/excluir/{v.id}" style="display:inline" data-confirm="Excluir esta vaga?">
                        <button type="submit" class="btn btn-sm btn-danger">Excluir</button>
                    </form>
                </td>
            </tr>
        {/for}
        </tbody>
    </table>
</div>
<script src="/js/app.js"></script>
</body>
</html>
