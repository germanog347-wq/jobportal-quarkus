<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{#if vaga.id}Editar vaga{#else}Nova vaga{/if} — Portal de Vagas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include navbar.html /}
<main class="container">
    <div class="card card-narrow">
        <h1>{#if vaga.id}Editar vaga{#else}Nova vaga{/if}</h1>
        {#if erro}<div class="alert alert-erro">{erro}</div>{/if}
        <form method="post" action="{acao}">
            <label for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" value="{vaga.titulo}" required>
            <label for="descricao">Descrição</label>
            <textarea id="descricao" name="descricao" required>{vaga.descricao}</textarea>
            <div class="form-row">
                <div>
                    <label for="empresa">Empresa</label>
                    <input type="text" id="empresa" name="empresa" value="{vaga.empresa}" required>
                </div>
                <div>
                    <label for="localizacao">Localização</label>
                    <input type="text" id="localizacao" name="localizacao" value="{vaga.localizacao}" required>
                </div>
            </div>
            <div class="form-row">
                <div>
                    <label for="faixaSalarial">Faixa salarial</label>
                    <input type="text" id="faixaSalarial" name="faixaSalarial" value="{vaga.faixaSalarial}">
                </div>
                <div>
                    <label for="dataExpiracao">Data de expiração</label>
                    <input type="date" id="dataExpiracao" name="dataExpiracao" value="{vaga.dataExpiracao}">
                </div>
            </div>
            <label class="checkbox-label" for="ativa">
                <input type="checkbox" id="ativa" name="ativa" {#if vaga.ativa}checked{/if}> Ativa
            </label>
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Salvar</button>
                <a href="/vagas/gestao" class="btn btn-outline">Cancelar</a>
            </div>
        </form>
    </div>
</main>
{#include footer.html /}
<script src="/js/app.js"></script>
</body>
</html>
