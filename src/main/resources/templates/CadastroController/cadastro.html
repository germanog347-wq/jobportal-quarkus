<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cadastro — Portal de Vagas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include fragments/nav.html usuario=null /}
<div class="container">
    <div class="auth-wrap" style="max-width:560px">
        <div class="card">
            <h2>Criar conta</h2>
            <p class="subtitle">Preencha seus dados para se candidatar às vagas.</p>
            {#if erro}<div class="alert alert-erro">{erro}</div>{/if}
            <form method="post" action="/usuario/salvar">
                <label>Nome completo</label>
                <input type="text" name="nome" required placeholder="Seu nome">

                <div class="form-row">
                    <div>
                        <label>E-mail</label>
                        <input type="email" name="email" required placeholder="seu@email.com">
                    </div>
                    <div>
                        <label>Senha</label>
                        <input type="password" name="senha" required minlength="4" placeholder="Mín. 4 caracteres">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label>CPF</label>
                        <input type="text" name="cpf" required data-mask="cpf" placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div>
                        <label>Data de nascimento</label>
                        <input type="date" name="dataNascimento">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label>Telefone</label>
                        <input type="text" name="telefone" required data-mask="phone" placeholder="(00) 00000-0000" maxlength="15">
                    </div>
                    <div>
                        <label>Cidade</label>
                        <input type="text" name="cidade" required placeholder="Sua cidade">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <a href="/auth/login" class="btn btn-outline">Já tenho conta</a>
                </div>
            </form>
        </div>
    </div>
</div>
<script src="/js/app.js"></script>
</body>
</html>
