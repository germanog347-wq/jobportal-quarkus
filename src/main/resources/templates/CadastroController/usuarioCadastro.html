<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Criar conta — Portal de Vagas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include navbar.html /}
<main class="container">
    <div class="auth-wrap auth-wide">
        <div class="card">
            <h1>Criar conta</h1>
            <p class="subtitle">Preencha seus dados para se candidatar às vagas.</p>
            {#if erro}<div class="alert alert-erro">{erro}</div>{/if}
            <form method="post" action="/usuario/salvar">
                <label for="nome">Nome completo</label>
                <input type="text" id="nome" name="nome" value="{dto.nome ?: ''}" required placeholder="Seu nome">

                <div class="form-row">
                    <div>
                        <label for="email">E-mail</label>
                        <input type="email" id="email" name="email" value="{dto.email ?: ''}" required placeholder="seu@email.com">
                    </div>
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" id="senha" name="senha" required minlength="4" placeholder="Mín. 4 caracteres">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" name="cpf" value="{dto.cpf ?: ''}" required data-mask="cpf" placeholder="000.000.000-00" maxlength="14">
                    </div>
                    <div>
                        <label for="dataNascimento">Data de nascimento</label>
                        <input type="date" id="dataNascimento" name="dataNascimento" value="{dto.dataNascimento ?: ''}">
                    </div>
                </div>

                <div class="form-row">
                    <div>
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" name="telefone" value="{dto.telefone ?: ''}" required data-mask="phone" placeholder="(00) 00000-0000" maxlength="15">
                    </div>
                    <div>
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" name="cidade" value="{dto.cidade ?: ''}" required placeholder="Sua cidade">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Cadastrar</button>
                    <a href="/auth/login" class="btn btn-outline">Já tenho conta</a>
                </div>
            </form>
        </div>
    </div>
</main>
{#include footer.html /}
<script src="/js/app.js"></script>
</body>
</html>
