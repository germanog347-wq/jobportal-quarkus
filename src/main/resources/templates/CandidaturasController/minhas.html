<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Minhas Candidaturas</title>
    <link rel="stylesheet" href="/css/estilo.css">
</head>
<body>
{#include fragments/nav.html}{/include}
<div class="container">
    <h1 class="page-title">Minhas candidaturas</h1>
    {#if candidaturas.isEmpty}
        <div class="card empty-state">
            <p>Você ainda não se candidatou a nenhuma vaga.</p>
            <a href="/vagas/visao-geral" class="btn btn-primary">Ver vagas</a>
        </div>
    {#else}
    <table>
        <thead>
            <tr><th>Vaga</th><th>Empresa</th><th>Status</th><th>Data</th></tr>
        </thead>
        <tbody>
        {#for c in candidaturas}
            <tr>
                <td><a href="/vagas/detalhe/{c.vaga.id}">{c.vaga.titulo}</a></td>
                <td>{c.vaga.empresa}</td>
                <td><span class="badge">{c.status.descricao}</span></td>
                <td>{c.criadoEm}</td>
            </tr>
        {/for}
        </tbody>
    </table>
    {/if}
</div>
<script src="/js/app.js"></script>
</body>
</html>
